:#f7f8ed;margin-bottom:24px;animation:appear .4s ease}.eyebrow{font-size:11px;letter-spacing:1px;color:#71816b}.entry h2{font-size:21px;font-weight:600;margin:13px 0 9px}.entry p{font-size:13px;line-height:1.7;color:#777b6c}.entry .preview{height:78px;margin:10px 0}.primary{width:100%;background:var(--ink);color:white;border-radius:13px;padding:13px;font-size:14px}.composer{padding:14px 20px 18px;border-top:1px solid #eae9df}.fake-input{border:1px solid #e3e1d6;border-radius:18px;padding:13px;color:#a4a497;font-size:12px;display:flex;justify-content:space-between}.footnote{font-size:10px;color:#939589;text-align:center;margin-top:10px;line-height:1.5}.prepare{flex:1;padding:35px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.orb{width:90px;height:83px;background:#ffb0bd;border-radius:43% 47% 41% 44%;display:grid;place-items:center;font-size:27px;color:#76484b;box-shadow:inset 0 -12px #ff9bad;animation:breathe 2s infinite;margin-bottom:28px}.prepare h2{font-size:25px;font-weight:500;margin:0 0 12px}.goal{color:#777f6f;line-height:1.8;font-size:14px}.steps{text-align:left;width:100%;padding:22px 12px;list-style:none}.steps li{padding:11px 0;font-size:13px;color:#a2a597;transition:.3s}.steps li.active{color:#446c58}.steps li:before{content:'○';margin-right:13px}.steps li.active:before{content:'●'}.prepbar{width:100%;height:3px;background:#ececdf;overflow:hidden}.prepbar span{display:block;background:#92a585;height:100%;animation:loading 5s linear forwards}.cancel{margin-top:24px;color:#818378;font-size:13px;padding:12px}.lesson-scroll{flex:1;overflow:auto;padding:23px 22px 10px}.section-label{display:flex;justify-content:space-between;color:#7e8977;font-size:11px}.dots{display:flex;gap:5px}.dots i{width:17px;height:4px;border-radius:3px;background:#e2e5d7}.dots i.on{background:#789272}.board{margin-top:18px;background:#f3f5e9;border-radius:22px;padding:23px 16px 18px;min-height:300px;position:relative;background-image:radial-gradient(#c4ccae66 .7px,transparent .7px);background-size:16px 16px}.board h2{font-family:"Songti SC",serif;font-weight:500;font-size:25px;line-height:1.4;margin:0 0 10px}.board .annotation{font-size:12px;color:#6d7d60;margin-top:8px;text-align:center}.circuit{width:100%;height:175px;overflow:visible}.wire{fill:none;stroke:#819476;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.flow{fill:none;stroke:#ff7586;stroke-width:3;stroke-dasharray:6 12;animation:current 1.5s linear infinite}.lamp{fill:#fff9d8;stroke:#839073;stroke-width:2}.caption{font-size:16px;line-height:1.8;min-height:92px;padding:22px 2px 8px}.caption:before{content:'“';color:#b5beaa;margin-right:5px}.voice-label{font-size:11px;color:#8b8e7f}.quick{display:flex;gap:8px;margin:13px 0}.quick button{font-size:12px;padding:8px 12px;border:1px solid #dedfd2;border-radius:20px}.controls{padding:13px 22px 18px;background:var(--paper);border-top:1px solid #e7e7db}.status-row{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:13px}.wave{display:flex;gap:3px;align-items:center;height:18px}.wave i{background:#77906c;width:3px;height:8px;border-radius:5px;animation:breathe .6s infinite alternate}.wave i:nth-child(2){height:16px;animation-delay:.2s}.control-row{display:flex;gap:9px}.control-row button{padding:12px 10px;background:#eeeee5;border-radius:14px;font-size:12px;flex:1}.control-row .hangup{background:var(--pink);color:white;flex:1.7}.audio-help{background:#fff0e7;border-radius:12px;padding:10px;font-size:11px;line-height:1.6;margin-top:12px}.audio-help button{font-size:11px;text-decoration:underline;margin-right:10px;padding:5px 0}.choices{display:flex;gap:10px;margin-top:16px}.choice{border:1px solid #ccd3be;background:#fffdf7;border-radius:13px;flex:1;padding:8px;min-width:0}.choice svg{height:96px}.choice strong{font-size:12px;font-weight:500}.feedback{font-size:13px;line-height:1.7;margin-top:13px;color:#5f7657}.summary{line-height:2;font-size:15px;padding:15px 0}.paused *{animation-play-state:paused!important}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes loading{from{width:0}to{width:100%}}@keyframes current{to{stroke-dashoffset:-36}}@media(max-width:500px){body{background:var(--paper)}.shell{margin:0;width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.controls{padding-bottom:max(15px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

#classroom header{padding:10px 18px}#classroom header h1{font-size:13px}#classroom header small,#classroom header .logo{display:none}.audio-strip{height:28px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:10px;color:#7a8470}.audio-strip .wave{opacity:.35}.audio-strip.speaking .wave{opacity:1}.audio-strip:not(.speaking) i{animation:none}.lesson-scroll{padding-top:12px}.board{min-height:350px;padding-bottom:75px}.caption{position:sticky;bottom:0;background:#fffdf7eb;border:1px solid #e2e4d7;box-shadow:0 4px 18px #303c1910;border-radius:15px;padding:12px;font-size:14px;min-height:0;z-index:3}.controls .status-row,.controls .footnote{display:none}.lesson-scroll .voice-label{font-size:10px}.board .teacher{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}.ink.drawing{pointer-events:auto}.lesson-actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lesson-actions button,.pill{border:1px solid #dcded0;border-radius:20px;padding:9px 12px;font-size:12px}.lesson-actions button.next{background:#343c32;color:white}.tools{padding:10px;background:#f0f1e5;border-radius:12px;margin:10px 0;line-height:1.6;font-size:12px}.tools button{padding:7px}.outline{font-size:12px;line-height:1.9;margin:16px 0}.outline summary{cursor:pointer}.quiz-option{display:flex;gap:12px;width:100%;padding:16px;border:1px solid #dedfd3;border-radius:14px;margin:10px 0;text-align:left;font-size:14px}.quiz-option.selected{border-color:#ff5a70;background:#fff0f2}.artifact{flex:1;overflow:auto;padding:24px}.artifact h2{font-size:24px;font-weight:500}.answer-sheet{padding:20px;background:#f2f5e8;border-radius:18px;margin-top:20px;line-height:1.8}.flash-face{min-height:330px;border:1px solid #dedfd3;border-radius:20px;padding:28px 24px;margin:22px 0;background:#fffefb}.flash-face h2{font-size:20px;line-height:1.6}.flash-actions{display:flex;gap:10px}.flash-actions button{f </style></head><body><main class="shell">
<section id="chat" class="view"><header><div class="logo">˘ᴗ˘</div><div><h1>Macaron</h1><small>把好奇，变成一点点理解</small></div><span class="tag">交互演示</span></header><div class="toolbar"><button id="playChat">▶ 播放对话</button><button id="skip">跳到上课入口</button><button id="reset">重置</button></div><div class="messages" id="messages"><div class="date">今天 · 一次小小的好奇</div></div><footer class="composer"><div class="fake-input"><span>演示对话 · 不需要输入</span><span>＋</span></div><div class="footnote">独立概念 Demo · 不连接账号，不保存学习记录</div></footer></section>
<section id="classroom" class="view hidden"><header><div class="logo">˘ᴗ˘</div><div><h1>看懂串联与并联</h1><small id="headerState">准备一起上课</small></div><span class="tag">模拟</span></header><div id="preparing" class="prepare"><div class="orb">˘ᴗ˘</div><div class="eyebrow">一节小课，只讲清一件事</div><h2 style="margin-top:15px">跟着电流，找一找路</h2><div class="goal">不用背电路图的形状。<br>这次，我们只看它有没有分岔。</div><ul class="steps"><li id="prep0" class="active">确定小目标：看懂电流路径</li><li id="prep1">整理黑板：准备两张电路图</li><li id="prep2">准备模拟语音，即将开始</li></ul><div class="prepbar"><span></span></div><div class="footnote">约 5 秒 · 演示准备过程，非真实服务连接</div><button class="cancel" id="cancel">取消连接，回到聊天</button></div><div id="lesson" class="lesson-scroll hidden"><div class="section-label"><span id="stageLabel"></span><span class="dots" id="dots"></span></div><div id="board" class="board"></div><div class="caption" id="caption" aria-live="polite"></div><div class="voice-label" id="voiceLabel">浏览器合成语音</div><div id="audioHelp" class="audio-help hidden"><span id="audioReason"></span><br><button id="enableAudio">点击开启声音</button><button id="silent">继续无声演示</button></div><div class="quick" id="quick"><button id="repeat">再讲一遍</button><button id="example">举个例子</button></div></div><footer id="controls" class="controls hidden"><div class="status-row"><div class="wave"><i></i><i></i><i></i></div><span id="status">准备讲解</span></div><div class="control-row"><button id="pause">Ⅱ 暂停</button><button id="mute">声音：开</button><button class="hangup" id="hangup">⌁ 挂断</button></div><div class="footnote">模拟语音 · 非真实通话 · 不录音，无需麦克风</div></footer></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
let mode='chat',chatIndex=0,chatTimer,prepTimers=[],lineTimer,watchdog,token=0,index=0,paused=false,muted=false,completed=false,answerCorrect=false,spoken=false,chatScroll=0,utterance;
const dialogue=[['user','串联和并联，我看电路图总是分不清。'],['bot','是看不出连接方式，还是不知道电流、电压怎么算？'],['user','看图就分不清，换个画法我就懵了。'],['bot','那先不算数。我们跟着电流走一遍，只看有没有分岔。一起用两张图试试？']];
function lamp(x,y){return `<circle class="lamp" cx="${x}" cy="${y}" r="13"/><path d="M${x-7} ${y-7}l14 14m0-14l-14 14" stroke="#839073" stroke-width="1.5"/>`}
function circuit(parallel,animate=true){const path=parallel?'M150 166H45V45H275V166H170 M45 100H275':'M150 166H45V45H275V166H170';return `<svg class="circuit" viewBox="0 0 320 195" role="img" aria-label="${parallel?'有两条灯泡支路的电路':'两个灯泡依次连接在同一路径的电路'}"><path class="wire" d="${path}"/>${animate?`<path class="flow" d="${path}"/>`:''}<path d="M150 151V181 M170 157V175" stroke="#4d6550" stroke-width="3"/><text x="132" y="155" font-size="12" fill="#52644a">+</text><text x="178" y="155" font-size="12" fill="#52644a">−</text>${parallel?lamp(160,45)+lamp(160,100)+`<circle cx="45" cy="100" r="5" fill="#ff7586"/><circle cx="275" cy="100" r="4" fill="#819476"/>`:lamp(112,45)+lamp(213,45)}${animate?'<path d="M40 125l5-9 5 9M85 40l9 5-9 5" fill="none" stroke="#ff7586" stroke-width="2"/>':''}</svg>`}
function entry(){if($('entry'))return;const e=document.createElement('div');e.id='entry';e.className='entry';e.innerHTML='<div class="eyebrow">一起讲清楚 · 语音小课</div><h2>看懂串联与并联</h2><div class="preview">'+circuit(false,false)+'</div><p>学会沿着导线找路径，判断有没有分支。<br>约 1 分钟演示 · 含一道看图小题</p><button class="primary" id="start">开始讲解 ↗</button>';$('messages').append(e);e.querySelector('svg').style.height='78px';$('start').onclick=start;}
function appendMessage(who,text){const e=document.createElement('div');e.className='message '+who;e.innerHTML=(who==='bot'?'<div class="byline">MACARON</div>':'');e.append(document.createTextNode(text));$('messages').append(e);$('messages').scrollTop=$('messages').scrollHeight;}
function tickChat(){if(chatIndex<dialogue.length){appendMessage(...dialogue[chatIndex++]);chatTimer=setTimeout(tickChat,1500)}else{entry();$('messages').scrollTop=$('messages').scrollHeight;}}
function stopSpeech(){token++;clearTimeout(lineTimer);clearTimeout(watchdog);if(synth)synth.cancel();utterance=null;}
function clearAll(){clearTimeout(chatTimer);prepTimers.forEach(clearTimeout);prepTimers=[];stopSpeech();}
function showChat(){mode='chat';$('classroom').classList.add('hidden');$('chat').classList.remove('hidden');$('classroom').classList.remove('paused');$('messages').scrollTop=chatScroll;}
function end(cancelled=false){if(mode==='chat')return;const wasComplete=completed;clearAll();showChat();if(!cancelled){let e=$('returnNote');if(!e){e=document.createElement('div');e.id='returnNote';e.className='message bot';$('messages').append(e)}e.textContent=wasComplete?'这次讲解已结束。我们比较了串联的一条路径和并联的分支，你也在这道图中找到了分支。入口留在这里，随时可以再看一遍。':'已结束，本次讲解未完成。下次可以从入口重新开始。';e.scrollIntoView({block:'nearest'});$('start').textContent='重新开始讲解 ↗';}}
function start(){if(mode!=='chat')return;clearAll();chatScroll=$('messages').scrollTop;mode='preparing';completed=false;answerCorrect=false;paused=false;muted=false;index=0;$('chat').classList.add('hidden');$('classroom').classList.remove('hidden');$('preparing').classList.remove('hidden');$('lesson').classList.add('hidden');$('controls').classList.add('hidden');$('headerState').textContent='准备一起上课';$('preparing').querySelector('.prepbar span').style.animation='none';void $('preparing').offsetWidth;$('preparing').querySelector('.prepbar span').style.animation='';[0,1,2].forEach(n=>$('prep'+n).classList.toggle('active',n===0));if(synth){synth.getVoices();const unlock=new SpeechSynthesisUtterance('');synth.speak(unlock)}prepTimers.push(setTimeout(()=>$('prep1').classList.add('active'),1700),setTimeout(()=>$('prep2').classList.add('active'),3400),setTimeout(()=>{if(mode!=='preparing')return;mode='lesson';$('preparing').classList.add('hidden');$('lesson').classList.remove('hidden');$('controls').classList.remove('hidden');$('hangup').textContent='⌁ 挂断';$('pause').disabled=false;$('pause').textContent='Ⅱ 暂停';$('mute').textContent='声音：开';render();speakLine();},5000));}
const lines=[{stage:0,text:'先看这张图。从电池正极出发，沿着外面的导线走，电流依次经过两只灯泡，再回到负极。'},{stage:0,text:'一路上，没有可以分开的支路。这两个灯泡串联在同一条路径上。图画得弯一点，连接关系也不会变。'},{stage:1,text:'再看这一张。在粉色的节点，电流可以分成两路，分别经过一只灯泡，之后再汇合。'},{stage:1,text:'两只灯泡接在相同的两个节点之间，这是并联。判断时看连接和分支，不要只看灯泡摆放的位置。'},{stage:2,text:'换你试试看。下面哪一张图中，电流可以分成两路，分别经过两只灯泡？点击一张图。'}];
function render(){const s=lines[index].stage;$('headerState').textContent='一起看懂电流的路径';$('stageLabel').textContent=['01 / 沿着一条路走','02 / 看看路在哪里分开','03 / 换你来找一找'][s];$('dots').innerHTML=[0,1,2].map(n=>'<i class="'+(n<=s?'on':'')+'"></i>').join('');$('board').innerHTML=s<2?'<div class="eyebrow">今天的小黑板</div><h2 style="margin-top:12px">'+(s===0?'只有一条路，依次经过':'走到这里，可以分两路')+'</h2>'+circuit(s===1)+'<div class="annotation">'+(s===0?'一条路径 · 两只灯泡依次连接':'两个节点之间 · 两条灯泡支路')+'</div>':'<div class="eyebrow">一个小检查</div><h2 style="margin-top:12px">哪张图有分支？</h2><div class="choices"><button class="choice" id="answerA">'+circuit(false,false)+'<strong>图 A</strong></button><button class="choice" id="answerB">'+circuit(true,false)+'<strong>图 B</strong></button></div><div class="feedback" id="feedback">先沿着导线走，再做选择。</div>';$('quick').classList.toggle('hidden',s===2);if(s===2){$('answerA').onclick=()=>answer(false);$('answerB').onclick=()=>answer(true)}}
function audioHelp(reason){stopSpeech();$('audioHelp').classList.remove('hidden');$('audioReason').textContent=reason;$('status').textContent='等待选择播放方式';$('voiceLabel').textContent='声音尚未播放';}
function speak(text,done){stopSpeech();const myToken=token;spoken=false;$('caption').textContent=text;$('audioHelp').classList.add('hidden');if(muted){$('status').textContent='无声演示 · 字幕推进中';$('voiceLabel').textContent='已静音 · 字幕自动推进';lineTimer=setTimeout(()=>{if(token===myToken&&!paused)done()},Math.max(3500,text.length*160));return;}const voice=synth&&synth.getVoices().find(v=>/^zh/i.test(v.lang));if(!synth||!voice){audioHelp('当前浏览器暂未提供中文语音。可重试声音，或继续无声演示。');return;}utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.voice=voice;utterance.rate=.95;utterance.onstart=()=>{if(token!==myToken)return;spoken=true;clearTimeout(watchdog);$('status').textContent='Macaron 正在讲解';$('voiceLabel').textContent='正在播放 · 浏览器合成语音';};utterance.onend=()=>{if(token===myToken&&!paused)done()};utterance.onerror=()=>{if(token===myToken)audioHelp('语音未能播放。请点击开启声音，或继续无声演示。')};$('status').textContent='正在请求播放声音';watchdog=setTimeout(()=>{if(token===myToken&&!spoken)audioHelp('浏览器尚未开始播放。点一下开启声音即可重试。')},3000);synth.speak(utterance);}

function finishDrawing(){drawMode=false;activeStroke=null;$('inkLayer').classList.remove('drawing');if(!strokes.some(x=>x.length>2)){$('drawTools').textContent='还没有有效圈选，请再画一次。';return}const p=lessonPlan[step];const svg=$('diagram').querySelector('svg').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');const circuitBody=svg.innerHTML;const ink=$('inkLayer').innerHTML;const br=$('board').getBoundingClientRect(),dr=$('diagram').getBoundingClientRect();const xml='<svg xmlns="http://www.w3.org/2000/svg" width="'+br.width+'" height="'+br.height+'" viewBox="0 0 '+br.width+' '+br.height+'"><rect width="100%" height="100%" fill="#f3f5e9"/><text x="20" y="30" font-size="18">'+p.title+'</text><svg x="'+(dr.left-br.left)+'" y="'+(dr.top-br.top)+'" width="'+dr.width+'" height="175" viewBox="0 0 320 195"><style>.wire{fill:none;stroke:#819476;stroke-width:3}.lamp{fill:#fff9d8;stroke:#839073;stroke-width:2}</style>'+circuitBody+'</svg><svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">'+ink+'</svg></svg>';$('drawTools').innerHTML='<img class="snapshot" alt="本地生成的电路与圈选 SVG 预览" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)+'"><p>本地 SVG 图片预览 · 未上传服务器。下方仅按圈选坐标匹配预设区域，不识别任意图像。</p><button onclick="explainDrawing()">模拟把圈选交给老师</button>';}
function explainDrawing(){const points=strokes.flat();const x=points.reduce((a,p)=>a+p[0],0)/points.length,y=points.reduce((a,p)=>a+p[1],0)/points.length;if(step>=2&&x<300&&y>220&&y<700){teacherMark();teacherSpeak('你的圈选靠近预设的左侧节点区域。这里连接了上下两条灯泡支路。你想问“为什么是一个节点”，还是“电流如何分开”？');$('drawTools').innerHTML='<button onclick="feedback(\'why\')">为什么是一个节点</button><button onclick="feedback(\'no\')">怎么判断分支</button>'}else{$('drawTools').innerHTML='这个圈选没有可靠匹配预设区域。你想问的是哪一部分？<br><button onclick="feedback(\'why\')">连接关系</button><button onclick="feedback(\'example\')">换个例子</button>';teacherSpeak('我不能识别任意圈画。请选一下，你想问连接关系，还是想换个例子？')}}
const questions=[{q:'图左右翻转后，下面两只灯泡是什么连接？',diagram:true,opts:['串联，因为电池在另一侧','并联，因为接在同一对节点间','无法判断，必须恢复原图'],a:1,step:3,why:'旋转或镜像不改变导线的连接关系。两只灯泡仍接在同一对节点间。'}, {q:'稳定串联电路中，电流经过第一只灯泡后会怎样？',opts:['被消耗一部分，第二只得到更少','保持相同；灯泡转化的是电能','变成电子运动的反方向'],a:1,step:1,why:'串联各处电流相同。传统电流方向与金属电子运动方向相反，不能混为同一概念。'}, {q:'一根导线直接跨接某灯泡两端，应如何辨别？',opts:['正常增加一个灯泡并联支路','只是让图变了形状','导线绕过灯泡，属于短接'],a:2,step:4,why:'短接线绕过负载，不等于普通负载支路。不要真实尝试电源短路。'}, {q:'判断两只灯泡并联，最有用的依据是什么？',opts:['画在上下两排','每只灯泡分别连接到同一对节点','导线画得一样长'],a:1,step:2,why:'连接关系决定串并联，位置和画线长度不能作为依据。'}];
function openArtifact(kind){clearAll();$('chat').classList.add('hidden');$('classroom').classList.add('hidden');$('artifact').classList.remove('hidden');mode=kind;if(kind==='quiz'){quizIndex=Math.min(memory.quizIndex||0,questions.length-1);selected=null;quizSubmitted=false;renderQuiz()}else{if(memory.flashSession&&memory.flashSession.index<memory.flashSession.ids.length){flashIds=memory.flashSession.ids;fi=memory.flashSession.index}else{flashIds=questions.map((_,i)=>i).sort((a,b)=>weakness(b)-weakness(a));fi=0}flipped=false;renderFlash()}}
function closeArtifact(){clearAll();$('artifact').classList.add('hidden');showChat();}
function artHeader(title){return '<header><button onclick="closeArtifact()" aria-label="回到聊天">‹</button><h1>'+title+'</h1><span class="tag">本地演示</span></header>'}
function renderQuiz(){const q=questions[quizIndex],r=memory.results[quizIndex];$('artifact').innerHTML=artHeader('练习 · Quiz')+'<div class="artifact"><div class="eyebrow">'+(quizIndex+1)+' / '+questions.length+' · 路径、节点与连接</div><h2>'+q.q+'</h2>'+(q.diagram?'<div class="board" style="min-height:0;padding:15px">'+circuit(true,false)+'</div>':'')+q.opts.map((x,i)=>'<button class="quiz-option '+(selected===i?'selected':'')+'" '+(quizSubmitted?'disabled':'')+' onclick="selected='+i+';renderQuiz()"><b>'+String.fromCharCode(65+i)+'</b><span>'+x+'</span></button>').join('')+(!quizSubmitted?'<button class="primary" '+(selected===null?'disabled':'')+' onclick="submitQuiz()">检查答案</button>':'<div class="answer-sheet"><strong>'+(r.correct?'这题判断正确':'这里还需要补讲')+'</strong><p>'+q.why+'</p>'+(!r.correct?'<button class="pill" onclick="remediate()">回到对应讲解 →</button><button class="pill" onclick="quizSubmitted=false;selected=null;renderQuiz()">再做一次</button>':'')+'<button class="primary" onclick="nextQuiz()">'+(quizIndex===questions.length-1?'查看练习小结':'下一题')+'</button></div>')+'<p class="localnote">移植 Growth QuizReferenceContent：选答 → 提交锁定 → 解释反馈 → 错题补讲／重做。仅本地保存。</p></div>';if(q.diagram)$('artifact').querySelector('.circuit').classList.add('variant');}
function submitQuiz(){if(selected===null||quizSubmitted)return;const old=memory.results[quizIndex]||{},correct=selected===questions[quizIndex].a;memory.results[quizIndex]={correct,firstPassCorrect:old.firstPassCorrect??correct,attempts:(old.attempts||0)+1,failures:(old.failures||0)+(correct?0:1),response:selected};quizSubmitted=true;save();renderQuiz()}
function nextQuiz(){if(!quizSubmitted)return;if(quizIndex<questions.length-1){quizIndex++;memory.quizIndex=quizIndex;save();selected=null;quizSubmitted=false;renderQuiz()}else{$('artifact').innerHTML=artHeader('练习小结')+'<div class="artifact"><h2>把薄弱处留下来。</h2><p>当前答对 '+Object.values(memory.results).filter(x=>x.correct).length+' / 4 题。这是本套题表现，不代表所有迁移。</p><button class="primary" onclick="openArtifact(\'flash\')">用 Flashcards 复习</button><button class="pill" onclick="retryIncorrect()">重做尚未答对的题</button><p class="localnote">错误记录会影响复习顺序，不会设置真实提醒。</p></div>';artifactCards()}}
function retryIncorrect(){quizIndex=questions.findIndex((_,i)=>!memory.results[i]?.correct);if(quizIndex<0)quizIndex=0;memory.quizIndex=quizIndex;save();selected=null;quizSubmitted=false;renderQuiz()}
function remediate(){lessonReturn=questions[quizIndex].step;$('artifact').classList.add('hidden');showChat();start()}
function weakness(i){const r=memory.ratings[i]||{};return (memory.results[i]?.failures||0)*3+(r.againCount||0)*3-(r.goodCount||0)}
function renderFlash(){if(fi>=flashIds.length){$('artifact').innerHTML=artHeader('复习 · Flashcards')+'<div class="artifact"><h2>这一轮回忆结束。</h2><p>你的自评已保存在本机。不会的卡，下次排在前面；自评“会”不等于客观掌握。</p><button class="primary" onclick="openArtifact(\'flash\')">再复习一轮</button><p class="localnote">没有建立定时提醒或 FSRS 到期计划。</p></div>';return}const id=flashIds[fi],q=questions[id];$('artifact').innerHTML=artHeader('复习 · Flashcards')+'<div class="artifact"><div class="eyebrow">'+(fi+1)+' / '+flashIds.length+' · 错点与不会的卡优先</div><div class="flash-face"><div class="eyebrow">'+(flipped?'答案':'先回忆，再看答案')+'</div><h2>'+(flipped?q.opts[q.a]:q.q)+'</h2>'+(q.diagram?circuit(true,false):'')+(flipped?'<p class="summary" style="font-size:14px">'+q.why+'</p>':'')+'</div>'+(flipped?'<div class="flash-actions"><button onclick="rateFlash(\'again\')">还不会</button><button onclick="rateFlash(\'good\')">我会了</button></div>':'<button class="primary" onclick="flipped=true;renderFlash()">显示答案</button>')+'<p class="localnote">移植 Growth FlashcardsContent：正反面与自评门槛、会／不会计数、会话进度。宿主存储改为本机；未移植 FSRS 调度。</p></div>'}
function rateFlash(result){if(!flipped||fi>=flashIds.length)return;const id=flashIds[fi],r=memory.ratings[id]||{reviewCount:0,againCount:0,goodCount:0};r.reviewCount++;r[result==='again'?'againCount':'goodCount']++;r.lastRating=result;memory.ratings[id]=r;flipped=false;fi++;memory.flashSession={ids:flashIds,index:fi};save();renderFlash()}
// Rebind initial entry if it already exists; preserve demo chat history.
if($('entry')){$('entry').remove();entry()}

</script></body></html>
