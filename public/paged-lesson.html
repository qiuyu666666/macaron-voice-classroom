<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分页课堂</title><style>*{box-sizing:border-box}body{margin:0;font:16px -apple-system,sans-serif;background:#f3f5ed;color:#263c39}main{height:100dvh;display:grid;grid-template-rows:40px auto minmax(0,1fr) auto;padding:16px;gap:12px}header,footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}header span{font-size:12px}.board{position:relative;overflow:hidden;background:#fffdf7;border-radius:20px;padding:clamp(16px,4vh,40px)}h1{font-size:clamp(20px,4vh,36px)}p{font-size:clamp(14px,2.3vh,20px)}.diagram{padding:20px;background:#e2eee5;border-radius:14px}button{padding:10px;border:0;border-radius:10px;background:#dcebe2;color:#263c39}input{display:block;width:70%}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.overlay.drawing{pointer-events:auto;touch-action:none}.teacher-orb{height:44px;overflow:hidden;display:grid;place-items:center;background:#fffdf7;--level:0}.teacher-orb i{width:100px;height:24px;border-radius:50%;background:linear-gradient(110deg,#f4a9c4,#c5b4ef,#9bd9ce);filter:blur(7px);opacity:.8;transform:scale(calc(.7 + var(--level)*.5));transition:transform .12s ease}@media(prefers-reduced-motion:reduce){.teacher-orb i{transform:none;transition:none;opacity:calc(.5 + var(--level)*.4)}}
</style><div id="root"></div><script src="/lesson.bundle.js"></script>
