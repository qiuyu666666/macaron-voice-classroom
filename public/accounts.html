<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macaron · 账号</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#36332e;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}main{background:#fffdf7;width:100%;max-width:420px;border-radius:28px;padding:28px}h1{font-size:24px;margin:0 0 8px}p{color:#77736d;line-height:1.6}label{display:block;margin:16px 0 6px}input:not([type=checkbox]){width:100%;padding:13px;border:1px solid #dedbd3;border-radius:12px;background:white;font:inherit}button,a{font:inherit}button{cursor:pointer;border:1px solid #dedbd3;border-radius:12px;background:#fffdf7;padding:12px}button:disabled{opacity:.5;cursor:wait}.primary{width:100%;background:#edced7;margin-top:18px;border:0}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1}.tabs button[aria-selected=true]{background:#e5f2eb;border-color:#bad3c6}.saved{display:flex;flex-direction:column;gap:8px}.saved button{text-align:left}small{display:block;color:#77736d;margin-top:4px;overflow-wrap:anywhere}#message{color:#9c453e;min-height:20px}#current{background:#e5f2eb;border-radius:12px;padding:12px}a{color:inherit}#logout{margin-top:8px}h2{font-size:16px;margin-top:24px}
</style><main><h1>你好，Macaron</h1><p>Alpha 测试环境 · 每个账号保留自己的聊天和课件</p><div id="current" hidden></div><button type="button" class="primary" id="pi-register">让 Pi 创建测试账号</button><small>Pi 调用 Macaron CLI 创建后自动填入，登录时初始化独立聊天。</small><div class="tabs"><button type="button" id="loginTab" aria-selected="true">登录</button><button type="button" id="registerTab" aria-selected="false">注册</button></div><form id="form"><div id="nameRow" hidden><label for="name">账号备注</label><input id="name" placeholder="例如：德语法语测试2" maxlength="80"></div><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><label><input id="save" type="checkbox" checked> 在这台电脑保存密码，方便切换测试账号</label><small>保存在本机私有文件中。Pi 创建流程还会将账号、密码和 UID 交给对应的 Pi 会话。</small><button class="primary" id="submit">登录并进入聊天</button></form><p id="message" role="status"></p><section id="savedSection" hidden><h2>已保存的账号</h2><div class="saved" id="saved"></div></section></main><script src="/accounts.js"></script></html>
